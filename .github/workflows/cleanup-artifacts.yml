# Deletes build artifacts (test screenshots, logs, old app builds) that are more than a day
# old, so the account's artifact storage does not fill up. Nothing in the repository itself
# is touched. Downloads people should keep are on the Releases page, not in artifacts.
name: Clean up old artifacts

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '.github/workflows/cleanup-artifacts.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete artifacts older than a day
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_HOURS: '24'
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "-${KEEP_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .created_at, .size_in_bytes, .name] | @tsv' > all.tsv
          total=$(wc -l < all.tsv | tr -d ' ')
          deleted=0; freed=0; kept=0; failed=0
          while IFS=$'\t' read -r id created size name; do
            if [[ "$created" < "$cutoff" ]]; then
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null 2>&1; then
                deleted=$((deleted + 1)); freed=$((freed + size))
              else
                failed=$((failed + 1))
              fi
            else
              kept=$((kept + 1))
            fi
          done < all.tsv
          {
            echo "Artifacts found: ${total}"
            echo "Deleted (older than ${KEEP_HOURS} h): ${deleted}, $((freed / 1048576)) MB"
            echo "Kept: ${kept}; could not delete: ${failed}"
            echo "GitHub recalculates the storage allowance every 6 to 12 hours."
          } | tee -a "$GITHUB_STEP_SUMMARY"
